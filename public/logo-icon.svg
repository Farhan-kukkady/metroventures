<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer architectural ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
  <!-- Inner dashed architectural ring -->
  <circle cx="50" cy="50" r="40" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2.5 1.5" opacity="0.85" />
  <!-- Inner fine guide ring -->
  <circle cx="50" cy="50" r="36" stroke="#FFFFFF" stroke-width="0.75" opacity="0.45" />

  <!-- Original 'M' Monogram (Cinzel Decorative) -->
  <path d="M28,72 V34 L35,29 L50,56 L65,29 L72,34 V72 M28,72 H35 M28,34 H24 M72,72 H65 M72,34 H76" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
  
  <!-- Architectural Accent Dots -->
  <circle cx="50" cy="21" r="2.2" fill="#FFFFFF" />
  <circle cx="50" cy="79" r="2.2" fill="#FFFFFF" />
</svg>
