<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" class="metro-logo-dark">
  <!-- Circular Architectural Emblem (Original Pure Black) -->
  <g transform="translate(60, 60)">
    <circle r="46" stroke="#000000" stroke-width="2.2" fill="none" />
    <circle r="40" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 1.5" fill="none" opacity="0.85" />
    <circle r="36" stroke="#000000" stroke-width="0.75" fill="none" opacity="0.45" />
    
    <path d="M-22,22 V-16 L-15,-21 L0,8 L15,-21 L22,-16 V22 M-22,22 H-15 M-22,-16 H-26 M22,22 H15 M22,-16 H26" 
          stroke="#000000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
    <circle cx="0" cy="-29" r="2.2" fill="#000000" />
    <circle cx="0" cy="29" r="2.2" fill="#000000" />
  </g>

  <!-- Typography: METRO VENTURES -->
  <g transform="translate(130, 0)">
    <text x="0" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#000000">METRO</text>
    <text x="160" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="400" letter-spacing="4" fill="#1E293B">VENTURES</text>
    
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="370" height="24" rx="2" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.8" />
      <text x="185" y="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="2.5" text-anchor="middle" fill="#000000">BUILDING DREAMS CREATING LANDMARKS</text>
    </g>

    <text x="1" y="106" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3" fill="#475569">REAL ESTATE &amp; CONSTRUCTION SOLUTIONS</text>
  </g>
</svg>
