<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" class="metro-logo">
  <defs>
    <linearGradient id="goldDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8934A" />
      <stop offset="50%" stop-color="#9A7832" />
      <stop offset="100%" stop-color="#72551A" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(60, 60)">
    <circle r="46" stroke="#0F172A" stroke-width="2.5" fill="none" />
    <circle r="40" stroke="url(#goldDarkGrad)" stroke-width="1.2" stroke-dasharray="2 1" fill="none" opacity="0.8" />
    <circle r="36" stroke="#0F172A" stroke-width="0.8" fill="#F8FAFC" />
    
    <path d="M-20,24 V-18 L-14,-22 L-2,8 L10,-22 L22,-18 V24 M-20,24 H-14 M-20,-18 H-24 M22,24 H16 M22,-18 H26" 
          stroke="url(#goldDarkGrad)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
    <circle cx="0" cy="-28" r="2" fill="url(#goldDarkGrad)" />
    <circle cx="0" cy="28" r="2" fill="url(#goldDarkGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 0)">
    <text x="0" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#0F172A">METRO</text>
    <text x="160" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="400" letter-spacing="4" fill="url(#goldDarkGrad)">VENTURES</text>
    
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="370" height="24" rx="2" fill="none" stroke="#0F172A" stroke-width="1" stroke-opacity="0.3" />
      <text x="185" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="2.5" text-anchor="middle" fill="#334155">BUILDING DREAMS CREATING LANDMARKS</text>
    </g>

    <text x="1" y="106" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#64748B">REAL ESTATE &amp; CONSTRUCTION SOLUTIONS</text>
  </g>
</svg>

