<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" class="metro-logo">
  <!-- Circular Architectural Emblem (Original White/Black) -->
  <g transform="translate(60, 60)">
    <!-- Outer ring -->
    <circle r="46" stroke="#FFFFFF" stroke-width="2.2" fill="none" />
    <!-- Inner dashed ring -->
    <circle r="40" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2.5 1.5" fill="none" opacity="0.85" />
    <circle r="36" stroke="#FFFFFF" stroke-width="0.75" fill="none" opacity="0.45" />
    
    <!-- Stylized Architectural 'M' Monogram -->
    <path d="M-22,22 V-16 L-15,-21 L0,8 L15,-21 L22,-16 V22 M-22,22 H-15 M-22,-16 H-26 M22,22 H15 M22,-16 H26" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
    <!-- Pillar accent dots -->
    <circle cx="0" cy="-29" r="2.2" fill="#FFFFFF" />
    <circle cx="0" cy="29" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: METRO VENTURES -->
  <g transform="translate(130, 0)">
    <!-- METRO -->
    <text x="0" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#FFFFFF">METRO</text>
    <!-- VENTURES -->
    <text x="160" y="50" font-family="'Cinzel', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="400" letter-spacing="4" fill="#E2E8F0">VENTURES</text>
    
    <!-- Subtitle Badge: Building dreams creating landmarks -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="370" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.7" />
      <text x="185" y="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" letter-spacing="2.5" text-anchor="middle" fill="#FFFFFF">BUILDING DREAMS CREATING LANDMARKS</text>
    </g>

    <!-- Micro Subline -->
    <text x="1" y="106" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3" fill="#94A3B8">REAL ESTATE &amp; CONSTRUCTION SOLUTIONS</text>
  </g>
</svg>
