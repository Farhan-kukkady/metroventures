<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" class="metro-logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D19A" />
      <stop offset="50%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9C7D38" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5BE" />
      <stop offset="50%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#7E6023" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(60, 60)">
    <!-- Outer ring -->
    <circle r="46" stroke="url(#goldStroke)" stroke-width="2.5" fill="none" />
    <!-- Inner ring -->
    <circle r="40" stroke="url(#goldStroke)" stroke-width="1.2" stroke-dasharray="2 1" fill="none" opacity="0.8" />
    <circle r="36" stroke="url(#goldStroke)" stroke-width="1" fill="#0A111F" fill-opacity="0.6" />
    
    <!-- Stylized Architectural 'M' Monogram -->
    <path d="M-20,24 V-18 L-14,-22 L-2,8 L10,-22 L22,-18 V24 M-20,24 H-14 M-20,-18 H-24 M22,24 H16 M22,-18 H26" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none" />
    <!-- Pillar accent dots -->
    <circle cx="0" cy="-28" r="2" fill="url(#goldGrad)" />
    <circle cx="0" cy="28" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: METRO VENTURES -->
  <g transform="translate(130, 0)">
    <!-- METRO -->
    <text x="0" y="50" font-family="'Cinzel', 'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">METRO</text>
    <!-- VENTURES -->
    <text x="160" y="50" font-family="'Cinzel', 'Cinzel Decorative', 'Playfair Display', Georgia, serif" font-size="34" font-weight="400" letter-spacing="4" fill="#F1F5F9">VENTURES</text>
    
    <!-- Subtitle Badge: Building dreams creating landmarks -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="370" height="24" rx="2" fill="none" stroke="url(#goldStroke)" stroke-width="1" stroke-opacity="0.6" />
      <text x="185" y="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" letter-spacing="2.5" text-anchor="middle" fill="#CBD5E1">BUILDING DREAMS CREATING LANDMARKS</text>
    </g>

    <!-- Micro Subline -->
    <text x="1" y="106" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3" fill="#94A3B8">REAL ESTATE &amp; CONSTRUCTION SOLUTIONS</text>
  </g>
</svg>

